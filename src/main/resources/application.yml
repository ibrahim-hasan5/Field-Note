spring:
  application:
    name: field-notes-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/field_notes
    username: postgres
    password: mora12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema; JPA only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  firebase:
    service-account-path: classpath:firebase-service-account.json
  photos:
    upload-dir: ./uploads/photos
    base-url: http://localhost:8080

logging:
  level:
    com.fieldnotes: DEBUG
    org.springframework.security: INFO
